[project]
name = "rentproof-backend"
version = "0.1.0"
description = "RentProof — AI investigator + evidence room builder for renter deposit disputes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-ai>=0.0.13",
    "python-multipart>=0.0.12",
    "pdfplumber>=0.11.0",
    "reportlab>=4.2.0",
    "pillow>=11.0.0",
    "python-dotenv>=1.0.1",
    "websockets>=13.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
