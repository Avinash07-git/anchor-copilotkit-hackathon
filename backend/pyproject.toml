[project]
name = "anchor-backend"
version = "0.1.0"
description = "Anchor — the intelligent layer that was always missing. Three lenses, one app."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-ai-slim[google]>=0.0.36",
    "google-generativeai>=0.8.3",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.1",
    "websockets>=13.0",
    "sse-starlette>=2.1.3",
    "mcp>=1.0.0",
    "copilotkit>=0.1.88",
    "langgraph>=0.2.0",
    "psycopg[binary]>=3.3.4",
    "mcp-use>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
